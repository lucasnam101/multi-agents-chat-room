[package]
name = "agentchat"
version = "0.1.0"
description = "Local multi-agent dev chat"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Without this, even a `cargo build --release` binary still tries to load
# the UI from the Vite devUrl (127.0.0.1:1420) instead of the embedded
# `dist/` assets - it silently fails with ERR_CONNECTION_REFUSED once no
# Vite process happens to be running in the background. Always pass
# `--features custom-protocol` when building a binary meant to run
# standalone (release builds, the packaged app, the desktop shortcut).
# Local dev via `cargo run` + a running Vite server should NOT use this.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "macros", "json"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1"
dotenvy = "0.15"
walkdir = "2"

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]
